#
# Validates workflow syntax and regression-tests embedded workflow logic.
#
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax

name: Lint workflows

on:
  push:
    paths:
    - ".github/workflows/**"
    - "tests/dependabot-auto-merge.sh"
  pull_request:
    paths:
    - ".github/workflows/**"
    - "tests/dependabot-auto-merge.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: audit

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Lint workflows
      uses: docker://rhysd/actionlint:latest
      with:
        args: -color

    - name: Test Dependabot auto-merge routing
      run: bash tests/dependabot-auto-merge.sh
