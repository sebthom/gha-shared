#
# Validates workflows, action metadata, shell scripts, and embedded merge routing before merging Dependabot updates.
#
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax

name: Build

on:
  push:
    paths:
    - ".github/actions/**"
    - ".github/workflows/**"
    - "**/*.sh"
    - "tests/actionlint-actions.yml"
  pull_request:
    paths:
    - ".github/actions/**"
    - ".github/workflows/**"
    - "**/*.sh"
    - "tests/actionlint-actions.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: audit

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Verify action fixture coverage
      # Every checked-in local action must be referenced so actionlint loads its metadata and required inputs.
      shell: bash
      run: |
        missing=false
        while IFS= read -r -d '' action_file; do
          printf '%s\n' "$action_file"
          action_path="./${action_file%/*}"
          if ! awk -v expected="$action_path" \
            '$1 == "-" && $2 == "uses:" && $3 == expected { found = 1 } END { exit !found }' \
            tests/actionlint-actions.yml; then
            echo "::error file=tests/actionlint-actions.yml::Missing reference to $action_path"
            missing=true
          fi
        done < <(git ls-files -z -- '.github/actions/**/action.yml' '.github/actions/**/action.yaml')
        if [[ "$missing" == true ]]; then
          exit 1
        fi

    - name: Lint actions
      # actionlint discovers and validates the local actions through tests/actionlint-actions.yml.
      uses: docker://rhysd/actionlint:latest
      with:
        args: -color -verbose tests/actionlint-actions.yml

    - name: Lint workflows
      uses: docker://rhysd/actionlint:latest
      with:
        args: -color -verbose

    - name: Lint shell scripts
      # Check all shell scripts while keeping this validation job read-only by leaving PR comments disabled.
      # https://github.com/luizm/action-sh-checker
      uses: luizm/action-sh-checker@883217215b11c1fabbf00eb1a9a041f62d74c744 # v0.10.0
      env:
        # Follow resolvable sources but ignore dynamic runtime paths that static analysis cannot locate.
        SHELLCHECK_OPTS: -x -e SC1090
      with:
        sh_checker_comment: false
        sh_checker_shfmt_disable: true

    - name: Test Dependabot auto-merge routing
      run: bash tests/dependabot-auto-merge.sh


  dependabot-pr-auto-merge:
    # Merge only after workflow, action, and shell validation plus routing tests succeed for this Dependabot PR.
    needs: build

    # The called workflow repeats these checks because standalone callers need the same trust boundary.
    # Check both the actor and PR author so this write-capable job only runs for Dependabot updates.
    # Manual reruns keep the original actor and remain allowed.
    if: >-
      needs.build.result == 'success' &&
      github.event_name == 'pull_request' &&
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]'

    permissions:
      contents: write
      pull-requests: write

    # Use the published revision so the merge implementation is not resolved from this pull request.
    uses: sebthom/gha-shared/.github/workflows/reusable.dependabot-auto-merge.yml@v1
    with:
      package-ecosystems: '["github-actions"]'
      merge-method: squash
      merge-major-updates: true
