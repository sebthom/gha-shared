#
# Validates workflow syntax and embedded merge routing, then merges eligible Dependabot updates.
#
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax

name: Build

on:
  push:
    paths:
    - ".github/workflows/**"
    - "tests/dependabot-auto-merge.sh"
  pull_request:
    paths:
    - ".github/workflows/**"
    - "tests/dependabot-auto-merge.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: audit

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Lint workflows
      uses: docker://rhysd/actionlint:latest
      with:
        args: -color

    - name: Test Dependabot auto-merge routing
      run: bash tests/dependabot-auto-merge.sh


  dependabot-pr-auto-merge:
    # Merge only after workflow linting and routing regression tests succeed for this Dependabot PR.
    needs: actionlint

    # The called workflow repeats these checks because standalone callers need the same trust boundary.
    # Check both the actor and PR author so this write-capable job only runs for Dependabot updates.
    # Manual reruns keep the original actor and remain allowed.
    if: >-
      needs.actionlint.result == 'success' &&
      github.event_name == 'pull_request' &&
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]'

    permissions:
      contents: write
      pull-requests: write

    # Use the published revision so the merge implementation is not resolved from this pull request.
    uses: sebthom/gha-shared/.github/workflows/reusable.dependabot-auto-merge.yml@v1
    with:
      package-ecosystems: '["github-actions"]'
