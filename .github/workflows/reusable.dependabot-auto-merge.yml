#
# Merges eligible Dependabot pull requests after the caller's validation job succeeds.
#
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
name: Dependabot Auto-Merge

on:
  workflow_call:
    inputs:
      package-ecosystems:
        description: 'JSON array of Dependabot package ecosystems eligible for merging; use ["*"] for all or [] for none'
        default: '["*"]'
        type: string
      merge-method:
        description: "Merge method for eligible Dependabot PRs; supported values are 'squash' and 'rebase'"
        default: squash
        type: string
      merge-major-updates:
        description: "Whether major Dependabot updates are eligible for merging"
        default: false
        type: boolean
      github-app-client-id:
        description: "Optional GitHub App client ID used with the private-key secret for workflow-file merge permission"
        default: ""
        type: string

    secrets:
      DEPENDABOT_MERGE_GITHUB_APP_PRIVATE_KEY:
        description: "Optional GitHub App private key; configure it as a Dependabot secret"
        required: false

jobs:
  dependabot-pr-auto-merge:
    # The caller must make this reusable job depend on validation; this workflow owns only eligibility and merging.
    # Require a Dependabot-authored PR and a Dependabot-initiated run before granting write permissions.
    # A manual rerun keeps its original actor, but a human-generated PR event must not enter this job.
    if: ${{ github.event_name == 'pull_request' && github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]' }}
    runs-on: ubuntu-latest

    permissions:
      # These scopes support the credential-free path. A configured App token replaces github.token for the merge.
      contents: write
      pull-requests: write

    steps:
    - name: Harden the runner (Audit all outbound calls)
      # https://github.com/step-security/harden-runner#getting-started
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: audit


    - name: Dependabot metadata
      id: METADATA
      # https://github.com/dependabot/fetch-metadata
      uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      with:
        github-token: "${{ github.token }}"


    - name: Normalize Dependabot package ecosystem
      id: ECOSYSTEM
      env:
        RAW_PACKAGE_ECOSYSTEM: ${{steps.METADATA.outputs.package-ecosystem}}
      run: |
        # fetch-metadata derives this output from Dependabot's branch prefix, which uses internal package-manager
        # slugs. Convert the aliases to the public package-ecosystem values accepted by dependabot.yml and this input.
        case "$RAW_PACKAGE_ECOSYSTEM" in
          docker_compose) package_ecosystem=docker-compose ;;
          dotnet_sdk) package_ecosystem=dotnet-sdk ;;
          git_submodules) package_ecosystem=gitsubmodule ;;
          github_actions) package_ecosystem=github-actions ;;
          go_modules) package_ecosystem=gomod ;;
          hex) package_ecosystem=mix ;;
          npm_and_yarn) package_ecosystem=npm ;;
          pre_commit) package_ecosystem=pre-commit ;;
          rust_toolchain) package_ecosystem=rust-toolchain ;;
          *) package_ecosystem=$RAW_PACKAGE_ECOSYSTEM ;;
        esac
        printf 'name=%s\n' "$package_ecosystem" >>"$GITHUB_OUTPUT"


    - name: Validate GitHub App configuration
      id: APP_AUTH
      env:
        GITHUB_APP_CLIENT_ID: ${{inputs.github-app-client-id}}
        GITHUB_APP_PRIVATE_KEY: ${{secrets.DEPENDABOT_MERGE_GITHUB_APP_PRIVATE_KEY}}
      run: |
        # Treat the credentials as one optional unit. Falling back on partial configuration would hide a typo and
        # reintroduce the workflow-file permission failure that the App is intended to prevent.
        if [[ -z "$GITHUB_APP_CLIENT_ID" && -z "$GITHUB_APP_PRIVATE_KEY" ]]; then
          printf 'enabled=false\n' >>"$GITHUB_OUTPUT"
        elif [[ -n "$GITHUB_APP_CLIENT_ID" && -n "$GITHUB_APP_PRIVATE_KEY" ]]; then
          printf 'enabled=true\n' >>"$GITHUB_OUTPUT"
        else
          echo "GitHub App client ID and private key must be configured together." >&2
          exit 1
        fi


    - name: Create GitHub App token
      id: APP_TOKEN
      if: steps.APP_AUTH.outputs.enabled == 'true'
      # Confine the persistent private key to a pinned action in this merge-only job. Callers must reference a
      # trusted published workflow revision instead of a same-repository workflow selected by pull request code.
      # The App token adds the Workflows permission named by concurrent workflow-file merge failures.
      # The merge endpoint uses Contents, while metadata above keeps using github.token, so this token does not
      # need Pull requests permission.
      # Observed failure: https://github.com/vegardit/docker-graalvm-maven/pull/60
      # Concurrent merge that changed the base first: https://github.com/vegardit/docker-graalvm-maven/pull/63
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
      with:
        client-id: ${{inputs.github-app-client-id}}
        private-key: ${{secrets.DEPENDABOT_MERGE_GITHUB_APP_PRIVATE_KEY}}
        permission-contents: write
        permission-workflows: write


    - name: Merge eligible Dependabot PR
      # A JSON array keeps ecosystem matching exact without parsing an ambiguous comma-separated string.
      # The explicit `["*"]` default means all ecosystems, while an empty array naturally matches none.
      # Match the normalized public ecosystem name so callers can copy values directly from dependabot.yml.
      # Major updates remain opt-in because semantic-versioning major releases can contain breaking changes.
      if: >-
        ${{
          (contains(fromJSON(inputs.package-ecosystems), '*') ||
           contains(fromJSON(inputs.package-ecosystems), steps.ECOSYSTEM.outputs.name)) &&
          (steps.METADATA.outputs.update-type == 'version-update:semver-minor' ||
           steps.METADATA.outputs.update-type == 'version-update:semver-patch' ||
           (inputs.merge-major-updates &&
            steps.METADATA.outputs.update-type == 'version-update:semver-major'))
        }}
      env:
        PR_NUMBER: ${{github.event.pull_request.number}}
        PR_HEAD_SHA: ${{github.event.pull_request.head.sha}}
        MERGE_METHOD: ${{inputs.merge-method}}
        # App authentication is optional so existing callers retain the simpler credential-free behavior.
        GH_TOKEN: ${{steps.APP_TOKEN.outputs.token || github.token}}
      run: |
        # workflow_call string inputs cannot restrict values, so validate before using the selected merge method.
        case "$MERGE_METHOD" in
          squash | rebase) ;;
          *)
            echo "Unsupported Dependabot merge method: $MERGE_METHOD" >&2
            exit 1
            ;;
        esac

        # The caller has already validated this head. Pinning `sha` rejects a later Dependabot force-push while
        # intentionally allowing GitHub to merge against a newer conflict-free base commit.
        merged=$(gh api \
          --method PUT \
          "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/merge" \
          --raw-field sha="$PR_HEAD_SHA" \
          --raw-field merge_method="$MERGE_METHOD" \
          --jq '.merged')
        if [[ $merged != true ]]; then
          echo "GitHub did not merge Dependabot PR #$PR_NUMBER." >&2
          exit 1
        fi
